<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ATX WIP</title>
    <meta name="description" content="A map of what's being built around Austin: new housing, towers, I-35, civic projects and trails, from city permits and public project data." />
    <script>
      try {
        const saved = localStorage.getItem('theme');
        document.documentElement.dataset.theme = saved === 'dark' ? 'dark' : 'light';
      } catch { document.documentElement.dataset.theme = 'light'; }
    </script>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="map" aria-label="Map of construction projects in Austin"></div>

    <header class="card header">
      <div class="brand">
        <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
          <g fill="currentColor">
            <path d="M12.00 2.85L12.38 3.87L13.47 3.92L12.62 4.60L12.91 5.65L12.00 5.05L11.09 5.65L11.38 4.60L10.53 3.92L11.62 3.87Z"/>
            <path d="M8.4 11c0-2.5 1.6-4.3 3.6-4.3s3.6 1.8 3.6 4.3z"/>
            <path d="M11.4 6.15h1.2v.75h-1.2z"/>
            <path d="M7.8 11h8.4v3.2H7.8z"/>
            <path d="M2.5 14.2h19v6.2h1v1.4h-21v-1.4h1z"/>
          </g>
          <g stroke="var(--surface)" stroke-width="1"><path d="M9.8 12v1.4M12 12v1.4M14.2 12v1.4M5 16.2v2.4M7.6 16.2v2.4M16.4 16.2v2.4M19 16.2v2.4"/></g>
          <path d="M10.3 20.4v-3.6h3.4v3.6z" fill="var(--surface)"/>
        </svg>
        <div>
          <h1 class="wordmark">ATX WIP</h1>
          <p class="counter" id="counter" aria-live="polite">Loading projects…</p>
        </div>
      </div>
      <div class="search">
        <input id="search" type="search" placeholder="Search projects or addresses" autocomplete="off" aria-label="Search projects" />
        <ul id="search-results" class="search-results" role="listbox" hidden></ul>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="share-btn" type="button" aria-label="Share" aria-expanded="false" aria-controls="share">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 12.5V2.5M6.5 6 10 2.5 13.5 6M6 9H4.5v8.5h11V9H14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </button>
        <button class="icon-btn" id="about-btn" type="button" aria-label="About and data sources">?</button>
        <button class="icon-btn" id="theme-btn" type="button" aria-label="Toggle dark mode">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2a8 8 0 1 0 0 16z" fill="currentColor" /><circle cx="10" cy="10" r="7.25" fill="none" stroke="currentColor" stroke-width="1.5" /></svg>
        </button>
      </div>
    </header>

    <div class="card share-pop" id="share" role="dialog" aria-label="Share" hidden>
      <span class="eyebrow">Share</span>
      <div class="share-row">
        <input id="share-url" type="text" readonly aria-label="Link to share" />
        <button class="share-copy" id="share-copy" type="button">Copy link</button>
      </div>
      <label class="share-check"><input type="checkbox" id="share-view" /> Include current view</label>
      <p class="caption share-note" id="share-note"></p>
    </div>

    <section class="card legend" id="legend" aria-label="Layers">
      <button class="legend-toggle" id="legend-toggle" type="button" aria-expanded="true">
        <span class="eyebrow">Layers</span>
        <span class="chev" aria-hidden="true">▾</span>
      </button>
      <div class="legend-body" id="legend-body">
        <div id="category-rows"></div>
        <div class="tick-rule" aria-hidden="true"></div>
        <div class="status-seg" id="status-seg" role="group" aria-label="Status"></div>
        <button class="changes-btn" id="changes-btn" type="button" hidden></button>
        <div class="tick-rule" aria-hidden="true"></div>
        <div class="view-row">
          <button class="text-btn" id="pitch-btn" type="button">2D</button>
          <button class="text-btn" id="reset-btn" type="button">Reset view</button>
        </div>
        <p class="caption legend-note">Buildings rise to their permitted floor count (about 3.6 m a floor). Large sites and projects without a floor count stay flat.</p>
      </div>
    </section>

    <section class="card timebar" id="timebar" aria-label="Timeline">
      <button class="icon-btn" id="time-play" type="button" aria-label="Play the timeline">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path class="play" d="M6 4l10 6-10 6z" fill="currentColor" /><path class="pause" d="M5 4h3.5v12H5zM11.5 4H15v12h-3.5z" fill="currentColor" /></svg>
      </button>
      <div class="time-track">
        <input type="range" id="time-range" aria-label="Show the map as of" />
        <div class="time-ends mono" aria-hidden="true"><span id="time-min"></span><span id="time-max"></span></div>
      </div>
      <div class="time-readout">
        <span class="time-label mono" id="time-label">Today</span>
        <button class="time-now" id="time-now" type="button" hidden>Back to today</button>
      </div>
    </section>

    <aside class="panel card" id="panel" aria-label="Project details" hidden>
      <button class="grabber" id="grabber" type="button" aria-label="Expand details"></button>
      <div class="panel-scroll" id="panel-content"></div>
    </aside>

    <dialog class="about card" id="about">
      <div id="about-content"></div>
    </dialog>

    <div class="tooltip" id="tooltip" role="tooltip" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
