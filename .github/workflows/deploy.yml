name: Refresh data and deploy

on:
  push:
    branches: [main]
  schedule:
    # 11:30 UTC daily, after the city's overnight permit and site plan rebuilds.
    - cron: '30 11 * * *'
  workflow_dispatch:
    inputs:
      rehearse_failure:
        description: 'Source ids to treat as failed (comma-separated), to check that the alert issue and email arrive'
        required: false
        default: ''

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.health.outputs.stale }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Each source keeps its last good result here, so an upstream outage
      # ships yesterday's data for that source instead of dropping it. Saved
      # image copies and the record of when projects first appeared ride along.
      - uses: actions/cache/restore@v6
        with:
          path: |
            data/snapshots
            data/image-cache
            data/history.json
            data/failing-since.json
          key: snapshots-${{ github.run_id }}
          restore-keys: snapshots-
      - run: npm run data
        env:
          # Optional. Without it, TxDOT highway closures are skipped and only city work zones ship.
          DRIVETEXAS_API_KEY: ${{ secrets.DRIVETEXAS_API_KEY }}
          REHEARSE_FAILURE: ${{ inputs.rehearse_failure }}
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: |
            data/snapshots
            data/image-cache
            data/history.json
            data/failing-since.json
          key: snapshots-${{ github.run_id }}
      - name: Update the project images to-do issue
        if: github.event_name != 'pull_request' && hashFiles('data/image-report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='Project images to add'
          n=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue edit "$n" --body-file data/image-report.md
          else gh issue create --title "$title" --body-file data/image-report.md; fi
      # GitHub turns off a public repo's schedule after 60 days without activity, and nothing commits here.
      # Re-enabling the workflow counts as activity, so the daily refresh never lapses.
      - name: Keep the daily schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable deploy.yml --repo ${{ github.repository }}
      # The issue @mentions the owner so GitHub emails them; editing an issue body alone sends nothing.
      - name: Open, update or close the data source problems issue
        id: health
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='Data source problems'
          n=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -f data/source-report.md ]; then
            if [ -z "$n" ]; then
              gh issue create --title "$title" --body-file data/source-report.md
            else
              before=$(gh issue view "$n" --json body --jq .body | head -1)
              gh issue edit "$n" --body-file data/source-report.md
              if [ "$before" != "$(head -1 data/source-report.md)" ]; then
                gh issue comment "$n" --body "@${{ github.repository_owner }} the set of failing sources changed; the list above is current."
              fi
            fi
          elif [ -n "$n" ]; then
            gh issue close "$n" --comment "Every data source fetched cleanly in ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
          fi
          if [ -f data/stale-sources.txt ]; then echo "stale=$(paste -sd, data/stale-sources.txt)" >> "$GITHUB_OUTPUT"; fi
      # Served from the root of atxwip.info, so the default base path of / applies.
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Runs after deploy so fresh data from the healthy sources still ships.
  stale-data:
    needs: [build, deploy]
    if: needs.build.outputs.stale != ''
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::Failing for a week or more: ${{ needs.build.outputs.stale }}. See the open 'Data source problems' issue."
          exit 1
