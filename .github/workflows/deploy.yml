name: Refresh data and deploy

on:
  push:
    branches: [main]
  schedule:
    # 11:30 UTC daily, after the city's overnight permit and site plan rebuilds.
    - cron: '30 11 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Each source keeps its last good result here, so an upstream outage
      # ships yesterday's data for that source instead of dropping it. Saved
      # image copies and the record of when projects first appeared ride along.
      - uses: actions/cache/restore@v6
        with:
          path: |
            data/snapshots
            data/image-cache
            data/history.json
          key: snapshots-${{ github.run_id }}
          restore-keys: snapshots-
      - run: npm run data
        env:
          # Optional. Without it, TxDOT highway closures are skipped and only city work zones ship.
          DRIVETEXAS_API_KEY: ${{ secrets.DRIVETEXAS_API_KEY }}
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: |
            data/snapshots
            data/image-cache
            data/history.json
          key: snapshots-${{ github.run_id }}
      - name: Update the project images to-do issue
        if: github.event_name != 'pull_request' && hashFiles('data/image-report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='Project images to add'
          n=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue edit "$n" --body-file data/image-report.md
          else gh issue create --title "$title" --body-file data/image-report.md; fi
      # Served from the root of atxwip.info, so the default base path of / applies.
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
