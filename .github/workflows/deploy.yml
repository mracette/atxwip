name: Refresh data and deploy

on:
  push:
    branches: [main]
  schedule:
    # 11:30 UTC daily, after the city's overnight permit and site plan rebuilds.
    - cron: '30 11 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Each source keeps its last good result here, so an upstream outage
      # ships yesterday's data for that source instead of dropping it.
      - uses: actions/cache/restore@v6
        with:
          path: data/snapshots
          key: snapshots-${{ github.run_id }}
          restore-keys: snapshots-
      - run: npm run data
        env:
          # Optional. Without it, TxDOT highway closures are skipped and only city work zones ship.
          DRIVETEXAS_API_KEY: ${{ secrets.DRIVETEXAS_API_KEY }}
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: data/snapshots
          key: snapshots-${{ github.run_id }}
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
